name: santa-shuffle
x-app: &app
  build: .
  image: santa-shuffle:local
  env_file: .env.docker
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    LOG_CHANNEL: stderr
    QUEUE_CONNECTION: database
    CACHE_STORE: database
    SESSION_DRIVER: database
  volumes:
    - storage:/app/storage
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    <<: *app
    healthcheck:
      disable: true
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=30", "--max-time=3600"]
    depends_on:
      app:
        condition: service_healthy
volumes:
  storage:
