name: Bug report
description: Report a reproducible problem. Report vulnerabilities privately instead.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include login codes, access links, real participant details, environment files or database dumps. See SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic participants and a disposable event.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Database engine, deployment method, browser and sanitized relevant logs.
