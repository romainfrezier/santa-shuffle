x-pg-env: &pg-env
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: santa_shuffle
  DB_USERNAME: santa_shuffle
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
services:
  app:
    environment: *pg-env
    depends_on:
      postgres:
        condition: service_healthy
  scheduler:
    environment: *pg-env
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    environment: *pg-env
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18.7-trixie@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    environment:
      POSTGRES_DB: santa_shuffle
      POSTGRES_USER: santa_shuffle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U santa_shuffle -d santa_shuffle"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres:
