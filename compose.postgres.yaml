x-pg-env: &pg-env
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: santa_shuffle
  DB_USERNAME: santa_shuffle
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
services:
  app:
    environment: *pg-env
    depends_on:
      postgres:
        condition: service_healthy
  scheduler:
    environment: *pg-env
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    environment: *pg-env
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18.6-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_DB: santa_shuffle
      POSTGRES_USER: santa_shuffle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U santa_shuffle -d santa_shuffle"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres:
